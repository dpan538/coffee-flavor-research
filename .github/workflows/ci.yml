name: CI

on:
  push:
    branches: [main, "codex/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unified web verification
        run: npm run ci:verify:web

  database:
    name: PostgreSQL 17 ontology and corpus gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    container:
      image: postgres:17-bookworm

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python for deterministic freeze exports
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3

      - name: Run unified database verification
        env:
          PGHOST: postgres
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          COFFEE_KB_ALLOW_DATABASE_DROP: 1
          COFFEE_KB_REBUILD_DB_ONE: coffee_sensory_kb_v0_ci_one
          COFFEE_KB_REBUILD_DB_TWO: coffee_sensory_kb_v0_ci_two
        run: bash db/scripts/ci-verify.sh
