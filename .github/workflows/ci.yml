name: CI

on:
  push:
    branches: [main, "codex/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unified web verification
        run: npm run ci:verify:web

  database-artifacts:
    name: Public artifact and corpus contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_COMMAND: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record public-artifact Python runtime
        run: |
          python --version
          python3 --version
          command -v python
          command -v python3

      - name: Run direct Batch 6 diagnostic
        run: |
          trap 'git restore --source=HEAD --worktree -- db/data/current' EXIT
          python -X dev -B db/scripts/generate-batch6-semantic-corpus.py

      - name: Run current descriptor diagnostic
        run: python -X dev -B db/scripts/test-current-descriptor-data.py

      - name: Run current public artifact verification
        run: bash db/scripts/ci-verify-current-artifacts.sh

  database-current:
    name: PostgreSQL 17 current schema and SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: postgres:17-bookworm

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deterministic database-test runtime
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 ca-certificates
          command -v python3
          python3 --version

      - name: Run current database verification
        env:
          PGHOST: postgres
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          COFFEE_KB_ALLOW_DATABASE_DROP: 1
          COFFEE_KB_CURRENT_DB: coffee_sensory_kb_v0_ci_current
        run: bash db/scripts/ci-verify-current-database.sh
