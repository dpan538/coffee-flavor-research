name: CI

on:
  push:
    branches: [main, "codex/**", "research/**"]
  pull_request:
  workflow_dispatch: # run every job by hand, including the database jobs

permissions:
  contents: read
  pull-requests: read # paths-filter lists a pull request's files through the API

jobs:
  # The data is frozen (owner, 2026-09-17): the database jobs run only when the database itself changed (db/ minus
  # the product layer), or on a manual run. Pushes that touch only the compute or experience layer take the web job alone.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect database changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # with "every", a file counts only if it matches all patterns, so the "!" lines are real exclusions; with the
          # default "some" a "!" line matches every file outside its path and the filter fires on any change
          predicate-quantifier: every
          filters: |
            db:
              - 'db/**'
              # the product layer lives under db/ too but no database job reads it (owner, 2026-09-17: a label or
              # button change must not re-run the database); a change to this workflow does not trigger them either —
              # run the workflow by hand (workflow_dispatch) to exercise every job
              - '!db/data/product-vector-v1/**'
              - '!db/data/backend-sequential-model-v2/revisions/**'
              - '!db/scripts/build-matrix-k-v1.py'
              - '!db/scripts/export-frontend-copy.py'
              - '!db/scripts/build-dynamic-question-bank.py'
              - '!db/scripts/build-neighbour-index.py'
              - '!db/scripts/build-simulation-test-set.py'
              - '!db/scripts/build-flow-experiment-data.py'
              - '!db/scripts/extract-coffeereview-structure-scores.py'

  checks:
    name: Format, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unified web verification
        run: npm run ci:verify:web

  database-artifacts:
    name: Public artifact and corpus contracts
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_COMMAND: python

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the 77K / 83K source-assertion ledgers are stored as xz archives in plain git (no Git LFS: the monthly LFS
      # bandwidth ran out and the job could not check out); this writes them back and verifies their SHA-256
      - name: Write the two large ledgers from their archives
        run: python -B db/scripts/materialize-large-ledgers.py

      - name: Record public-artifact Python runtime
        run: |
          python --version
          python3 --version
          command -v python
          command -v python3

      - name: Run direct Batch 6 diagnostic
        run: |
          trap 'git restore --source=HEAD --worktree -- db/data/current' EXIT
          python -X dev -B db/scripts/generate-batch6-semantic-corpus.py

      - name: Run current descriptor diagnostic
        run: python -X dev -B db/scripts/test-current-descriptor-data.py

      - name: Run current public artifact verification
        run: bash db/scripts/ci-verify-current-artifacts.sh

  database-current:
    name: PostgreSQL 17 current schema and SQL contracts
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.db == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: postgres:17-bookworm

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install deterministic database-test runtime
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 ca-certificates
          command -v python3
          python3 --version

      - name: Run current database verification
        env:
          PGHOST: postgres
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          COFFEE_KB_ALLOW_DATABASE_DROP: 1
          COFFEE_KB_CURRENT_DB: coffee_sensory_kb_v0_ci_current
        run: bash db/scripts/ci-verify-current-database.sh
