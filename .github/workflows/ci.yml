name: CI

on:
  push:
    branches: [main, "codex/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run unified web verification
        run: npm run ci:verify:web

  database-artifacts:
    name: Public artifact and corpus contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run current public artifact verification
        run: bash db/scripts/ci-verify-current-artifacts.sh

  database-current:
    name: PostgreSQL 17 current schema and SQL contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    container:
      image: postgres:17-bookworm

    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run current database verification
        env:
          PGHOST: postgres
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          COFFEE_KB_ALLOW_DATABASE_DROP: 1
          COFFEE_KB_CURRENT_DB: coffee_sensory_kb_v0_ci_current
        run: bash db/scripts/ci-verify-current-database.sh
