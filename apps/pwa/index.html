        <h1>flavorwords</h1>
        <p>
          <strong>Every taste has its own vocabulary.</strong> 风味，自有表达。
        </p>
        <p>
          像柑橘，像可可，或是某种熟悉却一时叫不出名字的味道。flavorwords
          帮你找到贴近感受的词，组成这一杯的风味卡。
        </p>
        <p>
          Some coffees are easy to taste, but harder to describe. A few
          questions about acidity, aroma, sweetness and mouthfeel lead to
          candidate flavor words; you confirm five, and they become your flavor
          card.
        </p>
        <p>
          The app needs JavaScript. A machine-readable summary of what it does,
          how it works and which sources it uses is at
          <a href="/llms.txt">/llms.txt</a>. Research, design and development:
          Dai Pan (潘岱).
        </p>
      </main>
    </noscript>
